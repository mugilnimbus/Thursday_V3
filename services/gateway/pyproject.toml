[project]
name = "thursday-gateway"
version = "0.1.0"
description = "Client-facing door: projects, chats, task control, event ingest, read model, notifications."
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk>=1.2.1",
    "httpx>=0.28.1",
    "thursday-contracts",
    "thursday-runtime",
]

[project.scripts]
thursday-gateway = "thursday_gateway.bootstrap.main:run"

[tool.uv.sources]
thursday-contracts = { workspace = true }
thursday-runtime = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
