[project]
name = "thursday-llm"
version = "0.1.0"
description = "Shared LLM provider layer: provider interface, LM Studio model lifecycle, chat model factory, raw body capture, stream timing."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "langchain-openai>=1.6.7",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
