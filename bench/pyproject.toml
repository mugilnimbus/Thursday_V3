[project]
name = "thursday-bench"
version = "0.1.0"
description = "Benchmark: drives an isolated Thursday stack with a fake model and measures what a client sees."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "psutil>=7",
    "uvicorn>=0.30",
    "websockets>=14",
]

[project.scripts]
bench = "thursday_bench.__main__:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "thursday_bench"
