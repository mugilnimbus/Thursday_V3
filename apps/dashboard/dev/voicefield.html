<!doctype html>
<!-- Development page for the voice field: switch between its states without a chat or a model.
     Served only by the dev server (npm run dev) at /dev/voicefield.html; it is not part of the build. -->
<html lang="en" data-theme="black">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice field</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: grid; grid-template-rows: minmax(0, 1fr) auto; background: #0b0b12; color: #e8e6f2; font: 14px/1.4 system-ui, sans-serif; }
      :root[data-theme='white'] body { background: #ffffff; color: #1a1a24; }
      canvas { display: block; width: 100%; height: 100%; min-height: 0; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 12px 16px; }
      button { font: inherit; color: inherit; background: transparent; border: 1px solid #6c5ce7; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
      button[aria-pressed='true'] { background: #6c5ce7; color: #fff; }
      .note { opacity: 0.7; margin-left: 8px; }
    </style>
  </head>
  <body>
    <canvas id="field" aria-hidden="true"></canvas>
    <div class="bar">
      <button data-state="idle">Idle</button>
      <button data-state="listening">Listening</button>
      <button data-state="thinking">Thinking</button>
      <button data-state="speaking">Speaking</button>
      <button id="cycle" aria-pressed="false">Play a conversation</button>
      <button id="face" aria-pressed="true">Face</button>
      <button id="mic" aria-pressed="false">Use my microphone</button>
      <button id="theme">Light / dark</button>
      <span class="note" id="note" role="status"></span>
    </div>
    <script type="module">
      import { VoiceFieldEngine } from '/src/lib/ui/voicefield.ts';

      const engine = new VoiceFieldEngine(document.getElementById('field'));
      const note = document.getElementById('note');
      const stateButtons = [...document.querySelectorAll('button[data-state]')];
      let timer = 0;

      function show(state) {
        engine.set(state);
        for (const button of stateButtons) button.setAttribute('aria-pressed', String(button.dataset.state === state));
      }
      function stopCycle() {
        clearTimeout(timer);
        timer = 0;
        document.getElementById('cycle').setAttribute('aria-pressed', 'false');
      }
      for (const button of stateButtons)
        button.addEventListener('click', () => {
          stopCycle();
          show(button.dataset.state);
        });

      // A conversation: you talk, it thinks, it answers, then rests.
      const script = [['listening', 4500], ['thinking', 3500], ['speaking', 7000], ['idle', 2500]];
      document.getElementById('cycle').addEventListener('click', (event) => {
        if (timer) return stopCycle();
        event.currentTarget.setAttribute('aria-pressed', 'true');
        let step = 0;
        const next = () => {
          const [state, duration] = script[step++ % script.length];
          show(state);
          timer = setTimeout(next, duration);
        };
        next();
      });

      // Real sound for the listening state. Nothing is recorded or sent anywhere.
      let audio = null;
      document.getElementById('mic').addEventListener('click', async (event) => {
        const button = event.currentTarget;
        if (audio) {
          audio.stream.getTracks().forEach((track) => track.stop());
          await audio.context.close();
          audio = null;
          engine.setAnalyser(null);
          button.setAttribute('aria-pressed', 'false');
          note.textContent = '';
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const context = new AudioContext();
          const analyser = context.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = 0.5;
          context.createMediaStreamSource(stream).connect(analyser);
          audio = { stream, context };
          engine.setAnalyser(analyser, context.sampleRate);
          button.setAttribute('aria-pressed', 'true');
          note.textContent = 'Listening and speaking now follow your microphone.';
          stopCycle();
          show('listening');
        } catch {
          note.textContent = 'The microphone is not available.';
        }
      });

      document.getElementById('face').addEventListener('click', (event) => {
        const on = event.currentTarget.getAttribute('aria-pressed') !== 'true';
        event.currentTarget.setAttribute('aria-pressed', String(on));
        engine.setFace(on);
      });

      document.getElementById('theme').addEventListener('click', () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'white' ? 'black' : 'white';
      });

      const wanted = new URLSearchParams(location.search).get('state');
      show(['idle', 'listening', 'thinking', 'speaking'].includes(wanted) ? wanted : 'thinking');
      window.voiceField = { show, face: (on) => engine.setFace(on) };
    </script>
  </body>
</html>
