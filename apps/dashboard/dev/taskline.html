<!doctype html>
<!-- Development page for the task card's live tool line: each state next to the others, without a gateway or a
     model. Served only by the dev server (npm run dev) at /dev/taskline.html; it is not part of the build. -->
<html lang="en" data-theme="black">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task card states</title>
    <style>
      body { overflow: auto; }
      #app .shell { display: block; height: auto; }
      #stage { width: min(760px, 100%); box-sizing: border-box; margin: 0 auto; padding: 16px; display: grid; gap: 22px; }
      h2 { margin: 0 0 6px; font: 600 12px/1.3 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
      .bar { display: flex; gap: 8px; justify-content: center; padding: 12px; }
      .bar button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--accent); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="bar"><button id="theme">Light / dark</button></div>
    <div id="app"><div class="app"><div class="shell"><div id="stage"></div></div></div></div>
    <script type="module">
      import { mount } from 'svelte';
      import '/src/lib/styles/tokens.css';
      import '/src/lib/styles/components.css';
      import '/src/lib/styles/app.css';
      import Icons from '/src/lib/ui/Icons.svelte';
      import TaskCard from '/src/features/chat/TaskCard.svelte';
      import { buildTasks } from '/src/lib/state/timeline.ts';

      mount(Icons, { target: document.body });

      let n = 0;
      const ev = (type, payload) => {
        n += 1;
        return { event_id: `e${n}`, source: 'main', seq: n, ts: new Date(Date.UTC(2026, 9, 2, 12, 0, n * 2)).toISOString(), project_id: 'p', chat_id: 'c', task_id: 't', type, payload };
      };
      const start = [
        ev('delegation', { instruction: 'Fix the bug in main.py and run it' }),
        ev('task_state', { state: 'working', pause_state: 'none' }),
        ev('llm_call', { agent: 'main', step: 1, status: 'ok' }),
      ];
      const read = (status, extra = {}) => ev('tool_call', { call_key: 't:1:0', tool: 'fs_read', arguments: { path: 'main.py' }, status, ...extra });
      const edit = (status, extra = {}) => ev('tool_call', { call_key: 't:2:0', tool: 'fs_edit', arguments: { path: 'main.py', old_string: 'x' }, status, ...extra });
      const done = [read('requested'), read('ok', { result: 'def main():\n    ...', seconds: 0.02 })];

      const samples = [
        ['A tool was just requested (purple, pulsing) and the task is working below it', [...start, read('requested')]],
        ['It finished and worked (green); the next step is under way', [...start, ...done, ev('llm_call', { agent: 'main', step: 2, status: 'ok' }), edit('requested')]],
        ['It failed (red); the agent is working on the next step', [...start, ...done, edit('requested'), edit('error', { result: 'old_string not found in main.py', seconds: 0.01 })]],
        ['Waiting for your approval: the call is requested, the question is orange', [...start, ...done, edit('requested'),
          ev('approval_requested', { approval_id: 'ap', tool: 'fs_edit', summary: 'Edit main.py', call_key: 't:2:0' }), ev('task_state', { state: 'input_required', pause_state: 'none' })]],
        ['Everything done', [...start, ...done, edit('requested'), edit('ok', { result: 'edited main.py (1 replacement)', seconds: 0.01 }), ev('task_state', { state: 'completed', pause_state: 'none', summary: 'Fixed the bug and ran main.py: exit 0.' })]],
        ['Stopped while a call was running (it never reported back)', [...start, read('requested'), ev('task_state', { state: 'canceled', pause_state: 'none' })]],
      ];

      const stage = document.getElementById('stage');
      for (const [label, events] of samples) {
        const box = document.createElement('section');
        box.innerHTML = `<h2>${label}</h2><div class="thread"></div>`;
        stage.append(box);
        events.forEach((e) => (e.task_id = 't'));
        mount(TaskCard, { target: box.querySelector('.thread'), props: { task: buildTasks(events).get('t') } });
      }
      requestAnimationFrame(() => document.querySelectorAll('.task-head[aria-expanded="false"]').forEach((b) => b.click()));
      document.getElementById('theme').onclick = () => {
        const root = document.documentElement;
        root.dataset.theme = root.dataset.theme === 'white' ? 'black' : 'white';
      };
    </script>
  </body>
</html>
