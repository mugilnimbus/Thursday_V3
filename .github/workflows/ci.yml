# Runs the project's own setup and checks on a clean machine at GitHub.
# It runs only when the owner starts it: "Run workflow" on the Actions tab, or
#   gh workflow run ci.yml -f os=both
# A push never starts it. Run it with "both" once before each release.
# A green run means a new user can follow the README's Quick start on that system.
name: CI

on:
  workflow_dispatch:
    inputs:
      os:
        description: Which systems to run on
        type: choice
        options: [both, linux, windows]
        default: both

# A new run cancels an older run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'linux' && '["ubuntu-latest"]' || inputs.os == 'windows' && '["windows-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Node.js (builds the dashboard)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python (the version in .python-version)
        run: uv python install

      - name: Set up, the way a new user does
        run: uv run --no-project python scripts/setup.py --yes

      - name: Run every check
        run: uv run python scripts/check.py

# Not run here, so run these by hand before a release (README, Development):
#   the dashboard browser tests (npm run test:e2e --prefix apps/dashboard, needs a Chromium),
#   the Android tests and build (JDK 21 and the Android SDK),
#   anything that needs a model server or a GPU.
