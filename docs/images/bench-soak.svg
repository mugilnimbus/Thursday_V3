<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-label="The long run">
<title>The long run</title>
<defs><linearGradient id="bg-light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f4f1fb"/></linearGradient><linearGradient id="flow-light" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="0.55" stop-color="#6d3fd6"/><stop offset="1" stop-color="#0d9488"/></linearGradient><filter id="glow-light" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="0.5" y="0.5" width="799" height="359" rx="14" fill="url(#bg-light)" stroke="#e2dcf0"/>
<rect x="28" y="26" width="4" height="16" rx="2" fill="#15803d"/>
<text x="40.0" y="39.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="start" letter-spacing="1.4">ENDURANCE</text>
<text x="28.0" y="68.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#14112a" text-anchor="start">30 minutes under load, nothing lost</text>
<text x="28.0" y="92.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a4560" text-anchor="start">20 chats send messages nonstop for 30 minutes. Halfway, the voice agent is killed.</text>
<text x="28.0" y="111.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a4560" text-anchor="start">Median of 2 runs.</text>
<rect x="28" y="132" width="178" height="104" rx="12" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb" stroke-opacity="0.4"/>
<rect x="28" y="150" width="3" height="68" rx="1.5" fill="#2563eb"/>
<text x="46.0" y="190.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#14112a" text-anchor="start">32.8k</text>
<text x="46.0" y="216.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4a4560" text-anchor="start">messages (18 per second)</text>
<rect x="218" y="132" width="178" height="104" rx="12" fill="#15803d" fill-opacity="0.08" stroke="#15803d" stroke-opacity="0.4"/>
<rect x="218" y="150" width="3" height="68" rx="1.5" fill="#15803d"/>
<text x="236.0" y="190.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#14112a" text-anchor="start">0</text>
<text x="236.0" y="216.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4a4560" text-anchor="start">errors, gaps or repeats</text>
<rect x="408" y="132" width="178" height="104" rx="12" fill="#6d3fd6" fill-opacity="0.08" stroke="#6d3fd6" stroke-opacity="0.4"/>
<rect x="408" y="150" width="3" height="68" rx="1.5" fill="#6d3fd6"/>
<text x="426.0" y="190.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#14112a" text-anchor="start">3.0 s</text>
<text x="426.0" y="216.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4a4560" text-anchor="start">until the agent was back</text>
<rect x="598" y="132" width="178" height="104" rx="12" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488" stroke-opacity="0.4"/>
<rect x="598" y="150" width="3" height="68" rx="1.5" fill="#0d9488"/>
<text x="616.0" y="190.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#14112a" text-anchor="start">+12 MB</text>
<text x="616.0" y="216.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4a4560" text-anchor="start">memory in 30 minutes</text>
<rect x="28" y="256" width="744" height="76" rx="10" fill="#15803d" fill-opacity="0.10"/>
<rect x="28" y="256" width="4" height="76" rx="2" fill="#15803d"/>
<text x="46.0" y="278.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#15803d" text-anchor="start" letter-spacing="1.3">WHAT THIS MEANS</text>
<text x="46.0" y="300.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#14112a" text-anchor="start">Thursday can run all day: a crash in the middle is recovered in seconds, every message is kept</text>
<text x="46.0" y="319.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#14112a" text-anchor="start">in order, and memory grows only 2% in half an hour.</text>
</svg>
