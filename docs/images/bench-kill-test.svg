<text x="46.0" y="370.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#14112a" text-anchor="start">This test found a real bug: a late event from the restarted agent marked a waiting message as</text>
<text x="46.0" y="389.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#14112a" text-anchor="start">delivered, so it was never sent again. Fix: only the sender marks a message delivered, with a test.</text>
