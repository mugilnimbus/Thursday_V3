<text x="28.0" y="68.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#14112a" text-anchor="start">Killing an agent loses nothing</text>
<text x="28.0" y="92.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a4560" text-anchor="start">5 chats talk for 60 s. At 40 s the voice agent is killed without warning.</text>
<text x="28.0" y="111.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a4560" text-anchor="start">Each mark is one run. Did every message still get its answer?</text>
