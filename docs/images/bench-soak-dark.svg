<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-label="The long run">
<title>The long run</title>
<defs><linearGradient id="bg-dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14112a"/><stop offset="1" stop-color="#07060c"/></linearGradient><linearGradient id="flow-dark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4d8dff"/><stop offset="0.55" stop-color="#9b63ff"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient><filter id="glow-dark" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="0.5" y="0.5" width="799" height="359" rx="14" fill="url(#bg-dark)" stroke="#2a2440"/>
<rect x="28" y="26" width="4" height="16" rx="2" fill="#4ade80"/>
<text x="40.0" y="39.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4ade80" text-anchor="start" letter-spacing="1.4">ENDURANCE</text>
<text x="28.0" y="68.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f1ecff" text-anchor="start">30 minutes under load, nothing lost</text>
<text x="28.0" y="92.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#bdb4d6" text-anchor="start">20 chats send messages nonstop for 30 minutes. Halfway, the voice agent is killed.</text>
<text x="28.0" y="111.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#bdb4d6" text-anchor="start">Median of 2 runs.</text>
<rect x="28" y="132" width="178" height="104" rx="12" fill="#4d8dff" fill-opacity="0.08" stroke="#4d8dff" stroke-opacity="0.4"/>
<rect x="28" y="150" width="3" height="68" rx="1.5" fill="#4d8dff"/>
<text x="46.0" y="190.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f1ecff" text-anchor="start">32.8k</text>
<text x="46.0" y="216.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#bdb4d6" text-anchor="start">messages (18 per second)</text>
<rect x="218" y="132" width="178" height="104" rx="12" fill="#4ade80" fill-opacity="0.08" stroke="#4ade80" stroke-opacity="0.4"/>
<rect x="218" y="150" width="3" height="68" rx="1.5" fill="#4ade80"/>
<text x="236.0" y="190.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f1ecff" text-anchor="start">0</text>
<text x="236.0" y="216.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#bdb4d6" text-anchor="start">errors, gaps or repeats</text>
<rect x="408" y="132" width="178" height="104" rx="12" fill="#9b63ff" fill-opacity="0.08" stroke="#9b63ff" stroke-opacity="0.4"/>
<rect x="408" y="150" width="3" height="68" rx="1.5" fill="#9b63ff"/>
<text x="426.0" y="190.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f1ecff" text-anchor="start">3.0 s</text>
<text x="426.0" y="216.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#bdb4d6" text-anchor="start">until the agent was back</text>
<rect x="598" y="132" width="178" height="104" rx="12" fill="#2dd4bf" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.4"/>
<rect x="598" y="150" width="3" height="68" rx="1.5" fill="#2dd4bf"/>
<text x="616.0" y="190.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f1ecff" text-anchor="start">+12 MB</text>
<text x="616.0" y="216.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#bdb4d6" text-anchor="start">memory in 30 minutes</text>
<rect x="28" y="256" width="744" height="76" rx="10" fill="#4ade80" fill-opacity="0.10"/>
<rect x="28" y="256" width="4" height="76" rx="2" fill="#4ade80"/>
<text x="46.0" y="278.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="11" font-weight="800" fill="#4ade80" text-anchor="start" letter-spacing="1.3">WHAT THIS MEANS</text>
<text x="46.0" y="300.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#f1ecff" text-anchor="start">Thursday can run all day: a crash in the middle is recovered in seconds, every message is kept</text>
<text x="46.0" y="319.0" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#f1ecff" text-anchor="start">in order, and memory grows only 2% in half an hour.</text>
</svg>
